    <circle cx="340" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="480" cy="70" r="1.8" opacity="0.85"/>
    <circle cx="610" cy="160" r="1.1" opacity="0.6"/>
    <circle cx="720" cy="90" r="2.2" opacity="0.95"/>
    <circle cx="850" cy="140" r="1.3" opacity="0.75"/>
    <circle cx="980" cy="60" r="1.7" opacity="0.8"/>
    <circle cx="1090" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="1220" cy="100" r="2.0" opacity="0.9"/>
    <circle cx="1310" cy="50" r="1.4" opacity="0.8"/>
    <circle cx="1600" cy="120" r="1.6" opacity="0.85"/>

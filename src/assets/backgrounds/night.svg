<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04091a"/>
      <stop offset="40%" stop-color="#071333"/>
      <stop offset="75%" stop-color="#0a1d4a"/>
      <stop offset="92%" stop-color="#0d2862"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>
    <radialGradient id="moonHalo" cx="75%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#e3efff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#a4cbfe" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#4a7eb8" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#0a1d4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="milkyWay" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7ca7e8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3c65a4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#071333" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#nightSky)"/>
  <ellipse cx="600" cy="300" rx="900" ry="300" transform="rotate(-25 600 300)" fill="url(#milkyWay)"/>
  <rect width="1920" height="1080" fill="url(#moonHalo)"/>
  <!-- Glowing Moon -->
  <circle cx="1440" cy="270" r="32" fill="#f4f8ff"/>
  <circle cx="1452" cy="265" r="28" fill="#071333" opacity="0.35"/>

    <circle cx="1150" cy="360" r="1.4" opacity="0.8"/>
    <circle cx="1680" cy="340" r="1.2" opacity="0.7"/>
  </g>
  <!-- Night Mountain Silhouettes -->
  <path d="M0 890 Q 450 860 900 880 T 1920 870 L 1920 1080 L 0 1080 Z" fill="#040915" opacity="0.85"/>
  <path d="M0 930 Q 550 900 1150 920 T 1920 910 L 1920 1080 L 0 1080 Z" fill="#02050b"/>

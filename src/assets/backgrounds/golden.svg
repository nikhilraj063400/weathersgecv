<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="goldenSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2454"/>
      <stop offset="40%" stop-color="#143c82"/>
      <stop offset="68%" stop-color="#245cb5"/>
      <stop offset="82%" stop-color="#567ec4"/>
      <stop offset="90%" stop-color="#e27c38"/>
      <stop offset="94%" stop-color="#fca85d"/>
      <stop offset="100%" stop-color="#1b2538"/>
    </linearGradient>
    <radialGradient id="goldenSun" cx="65%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#ffe2a4" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#f9923b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#245cb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldenRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182c47"/>
      <stop offset="100%" stop-color="#09121f"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#goldenSky)"/>
  <rect width="1920" height="1080" fill="url(#goldenSun)"/>
  <!-- Distant mountain ridges -->
  <path d="M0 870 Q 500 830 1000 860 T 1920 850 L 1920 1080 L 0 1080 Z" fill="#203d63" opacity="0.65"/>
  <path d="M0 910 Q 600 880 1200 890 T 1920 900 L 1920 1080 L 0 1080 Z" fill="url(#goldenRidge)"/>
  <!-- Golden reflection on water -->
  <rect x="0" y="930" width="1920" height="150" fill="#091526" opacity="0.95"/>
  <ellipse cx="1250" cy="940" rx="350" ry="14" fill="#ffb469" opacity="0.35"/>
</svg>
